# EC2 agent console — subdomain only (Amplify hosts apex/www).
# Example: agent.soterialabs.io → this server (Elastic IP A record).
#
# Copy to EC2:
#   sudo cp deploy/nginx-soteria-agents.conf /etc/nginx/sites-available/soteria-agents
#   sudo ln -sf /etc/nginx/sites-available/soteria-agents /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Basic auth (human Agent console only — create once on EC2):
#   sudo apt -y install apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd agent_admin
#
# TLS (only this hostname — do NOT include soterialabs.io; that cert is on Amplify):
#   sudo certbot --nginx -d agent.soterialabs.io --redirect -m you@example.com --agree-tos -n
#
# IMPORTANT: Exempt location ^~ /api/demeter/ and ^~ /api/x402/ BEFORE location / with auth_basic.
#
# Security group: inbound HTTP 80 + HTTPS 443.
# PM2: soteria-web on 127.0.0.1:3000

# --- HTTPS (production traffic) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name agent.soterialabs.io;

    # Certbot-managed paths (exist after: certbot --nginx -d agent.soterialabs.io)
    ssl_certificate /etc/letsencrypt/live/agent.soterialabs.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.soterialabs.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Demeter public APIs — machine clients only (Next.js validates DEMETER_LOGS_API_KEY)
    # Covers /api/demeter/logs (JSONL) and /api/demeter/console-logs (PM2 tail)
    location ^~ /api/demeter/ {
        auth_basic off;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 90s;

        # Optional rate limit (define zone in http {} — see docs/DEPLOY_EC2_PM2.md):
        # limit_req zone=demeter_logs burst=20 nodelay;
    }

    # x402 Bankr proxy APIs — machine clients only (Next.js validates X402_TOKEN_SCORE_API_KEY)
    location ^~ /api/x402/ {
        auth_basic off;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 90s;
    }

    # Agent console UI + all other API routes — human Basic auth
    location / {
        auth_basic "Agent console";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}

# --- HTTP (redirect to HTTPS after certbot; keep logs exemption if you proxy :80) ---
server {
    listen 80;
    listen [::]:80;
    server_name agent.soterialabs.io;

    # Demeter public APIs — same exemption on :80
    location ^~ /api/demeter/ {
        auth_basic off;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 90s;
    }

    # x402 Bankr proxy APIs — same exemption on :80
    location ^~ /api/x402/ {
        auth_basic off;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 90s;
    }

    # After certbot --redirect, this block is often replaced with return 301 https://...
    location / {
        auth_basic "Agent console";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
